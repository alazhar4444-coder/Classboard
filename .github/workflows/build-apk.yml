name: Build APK
on:
  push:
    branches: [ sijil-apk ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Alsijil-Almosahib-Lilmoallem.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Alsijil-Almosahib-Lilmoallem-APK
          path: Alsijil-Almosahib-Lilmoallem.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="sijil-v1.0.${{ github.run_number }}"
          gh release create "$TAG" "Alsijil-Almosahib-Lilmoallem.apk" --target "${{ github.sha }}" --title "السجل المصاحب للمعلم $TAG" --notes "نسخة أندرويد من السجل المصاحب للمعلم — تصميم الأستاذ الأزهر الناعبي"
