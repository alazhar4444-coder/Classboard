name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk maadh-school.apk
      - uses: actions/upload-artifact@v4
        with: { name: maadh-school-apk, path: maadh-school.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مدرسة معاذ v1.0.${{ github.run_number }}
          files: maadh-school.apk
