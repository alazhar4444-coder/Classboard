name: Build APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            cp signing/app.jks "$RUNNER_TEMP/release.jks"
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'virusjourney' }}
          KEY_ALIAS: app
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'virusjourney' }}
        run: |
          gradle assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/VirusJourney.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VirusJourney-apk
          path: out/VirusJourney.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/VirusJourney.apk \
            --target "${{ github.sha }}" \
            --title "رحلة داخل الفيروس — APK ${{ github.run_number }}" \
            --notes "نزّل ملف VirusJourney.apk وثبّته على جهاز أندرويد."
