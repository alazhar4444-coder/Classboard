name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ClassBoardApp.zip
      - name: Fix kotlin conflict
        run: |
          sed -i "s#^dependencies {#dependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')#" ClassBoardApp/app/build.gradle
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug
        working-directory: ClassBoardApp
      - uses: actions/upload-artifact@v4
        with:
          name: ClassBoard-apk
          path: ClassBoardApp/app/build/outputs/apk/debug/app-debug.apk
