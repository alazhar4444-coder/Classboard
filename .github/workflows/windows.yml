name: Build Windows app
on:
  push:
    branches: [ saeed-windows ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Sijil-Islamic-Saeed-Windows
          path: |
            dist/*.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="saeed-win-v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/Sijil-Islamic-Saeed-Setup-*.exe --target "${{ github.sha }}" --title "Sijil Islamic (Saeed Al-Naabi) Windows $TAG" --notes "Windows app — designed by Al-Azhar Al-Naabi"
