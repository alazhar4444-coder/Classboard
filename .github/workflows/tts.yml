name: Sijil voiceover
on:
  push:
    branches: [ sijil-video ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install edge-tts faster-whisper
      - name: Generate voice
        run: |
          mkdir -p out
          python3 gen.py || true
          python3 stt.py || true
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ls out/*;  gh release create "sijil-voice-${{ github.run_number }}" out/* --target "${{ github.sha }}" --prerelease --title "Sijil voiceover ${{ github.run_number }}" --notes "voice files"
