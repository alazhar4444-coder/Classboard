plugins { id 'com.android.application' }
android {
    namespace 'om.maadh.school'
    compileSdk 34
    defaultConfig {
        applicationId 'om.maadh.school'
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }
    signingConfigs {
        release {
            storeFile file('../keystore/maadh.jks')
            storePassword 'maadh2026'
            keyAlias 'maadh'
            keyPassword 'maadh2026'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.core:core:1.13.1' }
